name: Build PostgreSQL + extensions bundle

# Custom PostgreSQL binary distribution for alchemist-desktop's
# embedded-pg slot. Produces archives matching the layout the
# `postgresql_embedded` Rust crate expects (see its theseus matcher:
# `postgresql-<version>-<target_triple>.tar.gz`), but built WITH:
#
#   • full standard contrib (pgcrypto, uuid-ossp, citext, btree_gin,
#     btree_gist, hstore, intarray, ltree, pg_trgm, tablefunc, etc.)
#   • OpenSSL linking (required for pgcrypto)
#   • pgvector (third-party, the killer feature this bundle exists
#     for — vector embeddings out of the box for every app)
#
# Trigger by pushing a tag of the shape `v<pg>+pgvector-<ver>`
# (e.g. `v16.3.0+pgvector-0.7.4`). A rebuild of the same versions adds a
# revision suffix: `v16.3.0+pgvector-0.7.4-r2`. The suffix only names the
# release; the archives keep the plain `postgresql-<pg>-<triple>` names.
# postgresql_archive picks the highest matching tag by semver, and build
# metadata `pgvector-0.7.4-r2` sorts above `pgvector-0.7.4`. The build attaches three assets
# to the resulting GitHub release; the desktop crate downloads
# whichever matches its target triple at first launch.
#
# Why we own this instead of using theseus-rs/postgresql-binaries
# upstream: theseus-rs builds without OpenSSL (no pgcrypto) and
# never ships pgvector. We need both, and "every alchemist customer
# app gets the same capability set everywhere" is a foundational
# product requirement, not a per-environment hack.

on:
  push:
    tags:
      # GitHub Actions' tag-glob parser rejects '+' as a pattern
      # character (even though git itself accepts '+' in tag names),
      # so we can't write `v*+pgvector-*` directly. Match any v-N
      # prefix and let the `parse-versions` job extract pg + pgvector
      # from the full ref name.
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      postgres_version:
        description: "PostgreSQL source version (e.g. 16.3)"
        required: true
        default: "16.3"
      pgvector_version:
        description: "pgvector tag (e.g. v0.7.4)"
        required: true
        default: "v0.7.4"
      revision:
        description: "Bundle revision suffix for a rebuild of the same versions (e.g. r2); empty for none"
        required: false
        default: ""

permissions:
  contents: write # for creating the release + uploading assets

jobs:
  parse-versions:
    runs-on: ubuntu-latest
    outputs:
      pg: ${{ steps.v.outputs.pg }}
      pgvector: ${{ steps.v.outputs.pgvector }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.postgres_version }}" ]; then
            PG="${{ github.event.inputs.postgres_version }}"
            PGV="${{ github.event.inputs.pgvector_version }}"
            REV="${{ github.event.inputs.revision }}"
          else
            # Parse from the pushed tag: vMAJOR.MINOR.PATCH+pgvector-X.Y.Z[-rN]
            TAG_IN="${GITHUB_REF##*/}"
            PG="$(echo "$TAG_IN" | sed -E 's/^v([^+]+)\+pgvector-.*$/\1/')"
            PGV="v$(echo "$TAG_IN" | sed -E 's/^v[^+]+\+pgvector-(.*)$/\1/')"
            REV=""
            case "$PGV" in
              *-r[0-9]*) REV="${PGV##*-}"; PGV="${PGV%-*}" ;;
            esac
          fi
          # Normalize PG to a full X.Y.Z. The desktop's postgresql_embedded
          # pins `=16.3.0` and the archives are named postgresql-16.3.0-
          # <triple>, so the release TAG must carry the .0 too — a bare
          # X.Y (e.g. dispatch input "16.3") produced tag v16.3+... and a
          # 16.3 release the crate couldn't match. The Download step strips
          # the trailing .0 to fetch upstream source, so padding is safe.
          case "$PG" in
            *.*.*) ;;
            *.*) PG="${PG}.0" ;;
          esac
          TAG="v${PG}+pgvector-${PGV#v}${REV:+-$REV}"
          echo "pg=$PG" >> "$GITHUB_OUTPUT"
          echo "pgvector=$PGV" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved: pg=$PG pgvector=$PGV tag=$TAG"

  build:
    needs: parse-versions
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 runners were retired ("configuration not supported",
          # 2026-11-19). The runner OS no longer matters for compatibility:
          # MACOSX_DEPLOYMENT_TARGET below pins every binary to macOS 12.
          - os: macos-15
            target: aarch64-apple-darwin
            archive_suffix: "" # we set the full filename below
          # Pinned: ubuntu-latest moved to GCC 15 (C23 default), which PG
          # 16.3 does not compile under, and a newer image would also raise
          # the glibc floor of the archive.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive_suffix: ""
          # NOTE: x86_64-apple-darwin (Intel mac, macos-13) was REMOVED.
          # alchemist-desktop ships Apple-Silicon-only — see
          # alchemist-ai/.github/workflows/desktop-release.yml ("darwin-
          # aarch64 ONLY. No Intel / universal build"), runs-on macos-14.
          # So nothing ever requests an x86_64-apple-darwin PG asset, and
          # GitHub-hosted macos-13 runners queue-starved this leg for the
          # full job ceiling (24h on 2026-05-20, again ~1h+ on 2026-06-09)
          # — blocking the release for an asset with zero consumers. If an
          # Intel-mac desktop build is ever reintroduced, add this leg back
          # (and expect to solve the runner-availability problem then).
    runs-on: ${{ matrix.os }}
    # Fail fast instead of burning the job ceiling if a runner can't be
    # scheduled. Both remaining legs (arm64 macOS, x86_64 linux) build in
    # ~2-3 min, so 90 min is a generous ceiling, not a normal duration.
    timeout-minutes: 90
    env:
      # macOS only (ignored on Linux): alchemist-desktop's
      # minimumSystemVersion. Every Mach-O in the archive, including the
      # bundled OpenSSL and ICU, is built for it; the relocation check
      # fails the build on anything newer.
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      MACOS_MIN: "12.0"
      OPENSSL_VER: "3.5.4"
      ICU_VER: "77-1"
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # Only build tools from Homebrew. OpenSSL and ICU are built from
          # source below: Homebrew bottles target the runner's own macOS
          # (minos 15 here), so bundling them would make the archive refuse
          # to load on older Macs. libxml2/libxslt/zlib/libedit come from
          # the SDK (/usr/lib). e2fs uuid backend: native to macOS.
          brew install pkg-config

      - name: Cache OpenSSL + ICU (macOS)
        if: runner.os == 'macOS'
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-${{ matrix.target }}-macos${{ env.MACOSX_DEPLOYMENT_TARGET }}-openssl${{ env.OPENSSL_VER }}-icu${{ env.ICU_VER }}

      - name: Build OpenSSL + ICU for macOS ${{ env.MACOSX_DEPLOYMENT_TARGET }}
        if: runner.os == 'macOS' && steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          DEPS="$PWD/deps"
          NCPU="$(sysctl -n hw.ncpu)"
          # OpenSSL: Apple's libssl is private API and postgres' configure
          # refuses it, so pgcrypto needs a real OpenSSL.
          curl -fsSL -o openssl.tar.gz \
            "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VER}/openssl-${OPENSSL_VER}.tar.gz"
          tar -xzf openssl.tar.gz
          (cd "openssl-${OPENSSL_VER}" \
            && ./Configure darwin64-arm64-cc shared no-tests no-docs \
                 --prefix="$DEPS" --libdir=lib \
                 "-mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET}" \
            && make -j"$NCPU" >/dev/null \
            && make install_sw >/dev/null)
          # ICU for --with-icu (ICU collations).
          curl -fsSL -o icu.tgz \
            "https://github.com/unicode-org/icu/releases/download/release-${ICU_VER}/icu4c-${ICU_VER/-/_}-src.tgz"
          tar -xzf icu.tgz
          (cd icu/source \
            && ./runConfigureICU MacOSX --prefix="$DEPS" \
                 --disable-samples --disable-tests --disable-extras \
            && make -j"$NCPU" >/dev/null \
            && make install >/dev/null)
          ls -l "$DEPS/lib"

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libssl-dev libreadline-dev zlib1g-dev \
            libxml2-dev libxslt1-dev uuid-dev libicu-dev pkg-config \
            bison flex perl patchelf

      - name: Download + extract PostgreSQL ${{ needs.parse-versions.outputs.pg }} source
        env:
          PG_VER: ${{ needs.parse-versions.outputs.pg }}
        run: |
          set -e
          # PostgreSQL's release artifacts use the SHORT version (X.Y)
          # in both the source path AND the archive name — the upstream
          # convention is to omit a trailing .0 patch. The tag we ship
          # here carries the LONG semver-padded form (16.3.0) to match
          # what the postgresql_embedded Rust crate's theseus matcher
          # expects in the OUTPUT archive (postgresql-16.3.0-<triple>
          # .tar.gz). Without stripping the trailing .0 here the curl
          # 404s with "No such file or directory" — that's exactly
          # what kept this workflow failing in the queue for 17 hours
          # on the v16.3.0+pgvector-0.7.4 run; macOS-14 + Ubuntu both
          # died at this step within 50s.
          PG_SHORT="$PG_VER"
          case "$PG_VER" in
            *.*.0) PG_SHORT="${PG_VER%.0}" ;;
          esac
          curl -fL -o postgres.tar.bz2 \
            "https://ftp.postgresql.org/pub/source/v${PG_SHORT}/postgresql-${PG_SHORT}.tar.bz2"
          tar -xjf postgres.tar.bz2
          mv "postgresql-${PG_SHORT}" postgres-src
          ls postgres-src/contrib/ | head

      - name: Configure + build PostgreSQL
        env:
          PG_VER: ${{ needs.parse-versions.outputs.pg }}
        run: |
          set -e
          INSTALL_PREFIX="$PWD/staging"
          mkdir -p "$INSTALL_PREFIX"

          cd postgres-src

          # Build flags differ slightly between platforms because of where
          # the package managers put OpenSSL + uuid.
          if [ "$RUNNER_OS" = "macOS" ]; then
            OPENSSL_PREFIX="$GITHUB_WORKSPACE/deps"
            ICU_PREFIX="$GITHUB_WORKSPACE/deps"
            export CPPFLAGS="-I$OPENSSL_PREFIX/include -I$ICU_PREFIX/include"
            # headerpad: room for install_name_tool to rewrite load
            # commands in the relocation step below.
            export LDFLAGS="-L$OPENSSL_PREFIX/lib -L$ICU_PREFIX/lib -Wl,-headerpad_max_install_names"
            export PKG_CONFIG_PATH="$OPENSSL_PREFIX/lib/pkgconfig:$ICU_PREFIX/lib/pkgconfig"
            CONFIGURE_EXTRA="--with-uuid=e2fs"
            # strchrnul only exists from macOS 15.4, but configure finds it
            # by a link test against the runner's SDK, and the SDK header's
            # declaration clashes with PG 16.3's static fallback. Force the
            # fallback and give it its own name (later PG 16 minors fix
            # this upstream), so the build passes the 12.0 availability
            # check.
            export ac_cv_func_strchrnul=no
            sed -i '' 's/strchrnul(/pg_strchrnul_compat(/g' src/port/snprintf.c
            grep -n "pg_strchrnul_compat" src/port/snprintf.c
          else
            # e2fs (libuuid), NOT ossp. We install `uuid-dev` (= libuuid,
            # the e2fsprogs backend) above — NOT `libossp-uuid-dev` — so
            # `--with-uuid=ossp` fails configure with "library 'ossp-uuid'
            # or 'uuid' is required for OSSP UUID" (the 25s ubuntu failure
            # on the 2026-05-20 run). The `uuid-ossp` CONTRIB extension
            # still builds the same either way — the flag only selects the
            # backend lib — matching the working macOS leg's e2fs choice.
            CONFIGURE_EXTRA="--with-uuid=e2fs"
          fi

          ./configure \
            --prefix="$INSTALL_PREFIX" \
            --with-openssl \
            --with-libxml \
            --with-libxslt \
            --with-icu \
            $CONFIGURE_EXTRA

          # Core + contrib. -j uses available parallelism.
          make -j"$(getconf _NPROCESSORS_ONLN 2>/dev/null || sysctl -n hw.ncpu)" world-bin
          make install-world-bin
          # Verify pgcrypto + uuid-ossp .so/.dylib landed in lib/.
          ls "$INSTALL_PREFIX"/lib/ | grep -E "pgcrypto|uuid-ossp"

      - name: Build + install pgvector
        env:
          PGVECTOR_VER: ${{ needs.parse-versions.outputs.pgvector }}
        run: |
          set -e
          INSTALL_PREFIX="$PWD/staging"
          export PG_CONFIG="$INSTALL_PREFIX/bin/pg_config"
          export PATH="$INSTALL_PREFIX/bin:$PATH"

          git clone --depth 1 --branch "$PGVECTOR_VER" \
            https://github.com/pgvector/pgvector.git pgvector-src
          cd pgvector-src
          make -j"$(getconf _NPROCESSORS_ONLN 2>/dev/null || sysctl -n hw.ncpu)"
          make install

          # Verify vector.so/.dylib landed.
          ls "$INSTALL_PREFIX"/lib/ | grep -E "vector"
          ls "$INSTALL_PREFIX"/share/postgresql*/extension/ 2>/dev/null \
            || ls "$INSTALL_PREFIX"/share/extension/ | grep -E "vector"

      - name: Make macOS install relocatable
        if: runner.os == 'macOS'
        run: |
          set -e
          # As built, the binaries load libpq & co. from this runner's
          # staging path and OpenSSL/ICU from /opt/homebrew, so the archive
          # only ran on a machine with that exact layout (initdb crashed
          # everywhere else). Copy every non-system dylib into lib/, point
          # all load commands at @loader_path, and ad-hoc re-sign.
          # ICU records bare install names (libicuuc.77.dylib), so the
          # script also searches the source-built deps for those.
          DYLIB_SEARCH_PATH="$GITHUB_WORKSPACE/deps/lib" \
            python3 -I repo/scripts/macos-relocate.py fix staging

      - name: Verify macOS install is relocatable
        if: runner.os == 'macOS'
        run: python3 -I repo/scripts/macos-relocate.py check staging

      - name: Make Linux install relocatable
        if: runner.os == 'Linux'
        run: |
          set -e
          # As built, the binaries load ICU, OpenSSL, libxml2 and the rest
          # from this runner's /usr/lib, so the archive only ran where those
          # sonames exist: on Arch, initdb failed on libicuuc.so.74 and
          # postgres on libxml2.so.2. Copy every library outside the C
          # runtime into lib/ and set each RUNPATH to $ORIGIN.
          python3 -I repo/scripts/linux-relocate.py fix staging

      - name: Verify Linux install is relocatable
        if: runner.os == 'Linux'
        run: python3 -I repo/scripts/linux-relocate.py check staging

      - name: Replace hardlinks with copies
        run: |
          set -e
          # zic installs every timezone alias (UTC, Etc/UTC, Zulu, GMT, ...)
          # as a hardlink, and tar stores hardlinks as link entries. The
          # postgresql_archive extractor the desktop uses only unpacks
          # files, directories and symlinks, so it skipped all 245 link
          # entries in r2: share/timezone had Universal but no UTC, and
          # every connection that sets TimeZone=UTC failed. Give each name
          # its own file so the archive has no link entries at all.
          before="$(find staging -type f -links +1 | wc -l | tr -d ' ')"
          find staging -type f -links +1 | while IFS= read -r f; do
            cp -p "$f" "$f.unlink" && mv -f "$f.unlink" "$f"
          done
          after="$(find staging -type f -links +1 | wc -l | tr -d ' ')"
          echo "hardlinked files: ${before} before, ${after} after"
          test "$after" = "0"

      - name: Write bundle marker
        env:
          TAG: ${{ needs.parse-versions.outputs.tag }}
        run: |
          # The desktop reads this to tell a cached install of this release
          # from an older (or upstream theseus-rs) one at the same PG version.
          echo "$TAG" > staging/BUNDLE_RELEASE

      - name: Package archive
        id: pkg
        env:
          PG_VER: ${{ needs.parse-versions.outputs.pg }}
          TARGET: ${{ matrix.target }}
        run: |
          set -e
          # Filename must match the postgresql_embedded crate's theseus
          # matcher exactly: postgresql-<version>-<target_triple>.tar.gz.
          # The crate parses the version as semver, so 16.3 → 16.3.0 in
          # the request. We name the archive with the .0 patch suffix.
          PG_FULL="${PG_VER}"
          # If PG_VER has no patch (e.g. "16.3"), pad to "16.3.0"
          case "$PG_VER" in
            *.*.*) PG_FULL="$PG_VER" ;;
            *.*)   PG_FULL="${PG_VER}.0" ;;
          esac
          ARCHIVE="postgresql-${PG_FULL}-${TARGET}.tar.gz"
          tar -czf "$ARCHIVE" -C staging .
          ls -lh "$ARCHIVE"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Smoke test the archive from a fresh directory
        run: repo/scripts/smoke-test.sh "${{ steps.pkg.outputs.archive }}"

      - name: Upload as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: postgres-${{ matrix.target }}
          path: ${{ steps.pkg.outputs.archive }}
          retention-days: 7

  release:
    needs: [parse-versions, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./assets
          merge-multiple: true

      - name: List assets
        run: ls -la ./assets

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no actions/checkout, so `gh` has no local git
          # remote to infer the repo from ("fatal: not a git repository").
          # GH_REPO gives every `gh release` call its target explicitly —
          # cheaper than adding a checkout just for repo context.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.parse-versions.outputs.tag }}
        run: |
          set -e
          # Idempotent: create release if missing, then re-upload assets
          # (overwrites by name).
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$TAG" \
              --target "$GITHUB_SHA" \
              --notes "PostgreSQL ${{ needs.parse-versions.outputs.pg }} + pgvector ${{ needs.parse-versions.outputs.pgvector }} + full standard contrib. Bundled for alchemist-desktop's embedded-pg. macOS archives are relocatable (all non-system dylibs bundled under lib/ with @loader_path load commands)."
          fi
          for f in ./assets/*.tar.gz; do
            gh release upload "$TAG" "$f" --clobber
          done
